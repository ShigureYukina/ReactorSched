# Integration tests disable the Spring-managed worker so each test decides when (and whether)
# tasks are executed. Tests that need execution build a TaskWorkerEngine themselves.
reactorsched.worker.enabled=false
# Same for the recovery scanner: tests call LeaseRecoveryService.scanOnce() when they want a scan,
# which keeps the outcome of every test deterministic.
reactorsched.recovery.enabled=false
# Same for the scheduler: tests drive JobSchedulerService.scanOnce() themselves so the fire time of
# every assertion is the one the test chose, not the one a background thread happened to pick.
reactorsched.scheduler.enabled=false
# Adaptive control stays off in the shared test context; the adaptive integration test turns it on
# through its own property set so the concurrency limit is never changed behind other tests' backs.
reactorsched.adaptive.enabled=false
# Management-endpoint credentials for the integration tests. The admin user exercises the happy
# path; the viewer user proves the role check rejects authenticated non-admins with 403. These
# override the development defaults from application.yml (map entries merge per key).
reactorsched.security.users.admin.password=admin-test
reactorsched.security.users.admin.roles=ADMIN
reactorsched.security.users.viewer.password=viewer-test
reactorsched.security.users.viewer.roles=VIEWER
